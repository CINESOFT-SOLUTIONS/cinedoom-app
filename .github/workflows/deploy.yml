name: CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - staging
      - develop

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ========================================================
  # 1. AMBIENTE DE DESENVOLVIMENTO (Dev)
  # ========================================================
  deploy-dev:
    name: Deploy Development
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.cinedoom.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Sync Dev Schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://cinedoom_ci:cinedoom_ci@localhost:5432/cinedoom_dev?sslmode=disable' }}
        run: |
          pnpm prisma generate

      - name: Build Application for Development
        env:
          NODE_ENV: development
          NEXT_PUBLIC_APP_ENV: development
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://dev.cinedoom.com' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'dev-cinedoom-super-secret-key-32-chars' }}
        run: pnpm build

      - name: Deployment Status
        run: echo "Ambiente de Desenvolvimento (Dev) publicado com sucesso na branch develop."

  # ========================================================
  # 2. AMBIENTE DE HOMOLOGAÇÃO (Staging / HML)
  # ========================================================
  deploy-staging:
    name: Deploy Staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://hml.cinedoom.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build Application for Staging
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_ENV: staging
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://hml.cinedoom.com' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'staging-cinedoom-super-secret-key-32' }}
        run: pnpm build

      - name: Deployment Status
        run: echo "Ambiente de Homologação (Staging) publicado com sucesso na branch staging."

  # ========================================================
  # 3. AMBIENTE DE PRODUÇÃO (Production)
  # ========================================================
  deploy-production:
    name: Deploy Production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cinedoom.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build Application for Production
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_ENV: production
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'https://cinedoom.com' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'production-cinedoom-super-secret-key' }}
        run: pnpm build

      - name: Deployment Status
        run: echo "Ambiente de Produção publicado com sucesso na branch main."
